<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d17" />
    <title>Atacado Prime offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: #f4f6fb; color: #111827; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(420px, 100%); background: #ffffff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 24px; box-shadow: 0 20px 50px rgba(15, 23, 42, .12); }
      .mark { width: 44px; height: 44px; border-radius: 14px; background: #0b1830; color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 18px; }
      h1 { font-size: 20px; line-height: 1.2; margin: 0 0 10px; }
      p { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.5; }
      a, button { width: 100%; min-height: 44px; border: 0; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font: inherit; font-weight: 700; text-decoration: none; box-sizing: border-box; }
      a { background: #2563eb; color: #fff; margin-bottom: 10px; }
      button { background: #eef2ff; color: #1e3a8a; }
    </style>
    <script>
      (function () {
        var online = typeof navigator === "undefined" || navigator.onLine !== false;
        var tries = 0;
        try { tries = parseInt(sessionStorage.getItem("ap_offline_retry") || "0", 10) || 0; } catch (e) {}
        // Rede lenta (maquininha POS) estoura o timeout do cache mesmo com
        // internet: tenta a rota original 1x antes de cair na venda offline.
        if (online && tries < 1) {
          try { sessionStorage.setItem("ap_offline_retry", String(tries + 1)); } catch (e) {}
          setTimeout(function () {
            var q = location.search ? location.search + "&" : "?";
            location.replace(location.pathname + q + "r=" + Date.now());
          }, 1200);
          return;
        }
        try { sessionStorage.removeItem("ap_offline_retry"); } catch (e) {}
        if (!online && location.pathname !== "/vendas-offline") {
          setTimeout(function () {
            location.replace("/vendas-offline");
          }, 900);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="mark">AP</div>
      <h1>Você está offline</h1>
      <p>O app abriu sem internet. Você será levado para a venda offline; se o catálogo já foi sincronizado, continue vendendo normalmente.</p>
      <a href="/vendas-offline">Abrir venda offline</a>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
